name: readme stats

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install cloc
        run: |
          curl -sL -o "$RUNNER_TEMP/cloc.pl" \
            https://github.com/AlDanial/cloc/releases/download/v2.10/cloc-2.10.pl
          perl "$RUNNER_TEMP/cloc.pl" --version

      - name: generate stats section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          UTC_OFFSET: "8"
          CLOC: ${{ runner.temp }}/cloc.pl
        run: python3 scripts/gen_stats.py

      - name: commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Update readme stats" -- README.md
          git push
