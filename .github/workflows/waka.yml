name: waka readme stats

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: anmol098/waka-readme-stats@v5
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # 没有配 WakaTime 时，下面这些依赖 WakaTime 的板块全部关掉，
          # 只保留纯粹由 GitHub 数据算出来的部分。
          SHOW_TOTAL_CODE_TIME: "False"
          SHOW_TIMEZONE: "False"
          SHOW_PROJECTS: "False"
          SHOW_EDITORS: "False"
          SHOW_OS: "False"
          SHOW_LANGUAGE: "False"
          SHOW_LOC_CHART: "False"
          SHOW_LINES_OF_CODE: "False"
          # GitHub 数据板块
          SHOW_SHORT_INFO: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_PROFILE_VIEWS: "True"
          SHOW_UPDATED_DATE: "True"
          COMMIT_BY_ME: "True"
          COMMIT_MESSAGE: "Update readme stats"
